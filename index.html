<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HardwarePOS — කඩේ පරිගණක ක්‍රමය</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

<div class="app" id="app">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo-wrap" id="brandLogoWrap" style="display:none;">
        <img id="brandLogoImg" src="" alt="Shop Logo">
      </div>
      <div class="brand-mark" id="brandMark">H<span>P</span></div>
      <div class="brand-text">
        <strong id="shopNameLabel">HardwarePOS</strong>
        <small data-i18n="brand_sub">කඩේ කළමනාකරණය</small>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-btn active" data-view="sale" data-i18n="nav_sale">
        <span class="nav-ico"><i class="ph ph-shopping-cart"></i></span> විකුණුම් / බිල්පත
      </button>
      <button class="nav-btn" data-view="dashboard" data-i18n="nav_dashboard">
        <span class="nav-ico"><i class="ph ph-squares-four"></i></span> උපකරණ පුවරුව
      </button>
      <button class="nav-btn" data-view="items" data-i18n="nav_items">
        <span class="nav-ico"><i class="ph ph-package"></i></span> භාණ්ඩ (Items)
      </button>
      <button class="nav-btn" data-view="purchases" data-i18n="nav_purchases">
        <span class="nav-ico"><i class="ph ph-truck"></i></span> කඩේට ගත් බිල් (Purchases)
      </button>
      <button class="nav-btn" data-view="stock" data-i18n="nav_stock">
        <span class="nav-ico"><i class="ph ph-archive-box"></i></span> තොග වාර්තාව
      </button>
      <button class="nav-btn" data-view="customers" data-i18n="nav_customers">
        <span class="nav-ico"><i class="ph ph-users"></i></span> ගනුදෙනුකරුවන්
      </button>
      <button class="nav-btn" data-view="history" data-i18n="nav_history">
        <span class="nav-ico"><i class="ph ph-receipt"></i></span> විකුණුම් ඉතිහාසය
      </button>
      <button class="nav-btn" data-view="settings" data-i18n="nav_settings">
        <span class="nav-ico"><i class="ph ph-gear"></i></span> සැකසුම් / Backup
      </button>
    </nav>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="viewTitle">විකුණුම් / බිල්පත</div>
      <div class="topbar-right" style="display:flex; align-items:center; gap:16px;">
        <span id="todayDate"></span>
        
        <!-- Notification Bell -->
        <div class="notif-bell-wrap" id="notifBellWrap">
          <button class="topbar-bell-btn" id="bellBtn" title="Notifications">
            <i class="ph ph-bell"></i>
            <span class="bell-badge" id="bellBadge"></span>
          </button>
          <div class="notif-dropdown" id="notifDropdown">
            <div class="notif-header">
              <span data-i18n="notif_title">නිවේදන</span>
              <span id="notifCount" class="notif-count-badge">0</span>
            </div>
            <div class="notif-list" id="notifList"></div>
          </div>
        </div>

        <div class="lang-switcher-top">
          <button class="top-lang-btn" data-lang-btn="si" onclick="setLanguage('si')">සිං</button>
          <button class="top-lang-btn" data-lang-btn="en" onclick="setLanguage('en')">EN</button>
        </div>
      </div>
    </header>

    <section class="view-wrap" id="viewWrap">
      <!-- views injected here by JS -->
    </section>
  </main>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Modal root -->
<div id="modalRoot"></div>

<script src="js/i18n.js"></script>
<script src="js/singlish.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
